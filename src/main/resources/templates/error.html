<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg,#003580,#0057b8);">
<div class="card shadow-lg p-4 text-center" style="width:420px; border-radius:16px;">
  <div class="mb-3">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
  </div>
  <h4 class="fw-bold" th:text="'Error ' + ${status}">Error</h4>
  <p class="text-muted" th:text="${error}">Ha ocurrido un error inesperado.</p>
  <a th:href="@{/dashboard}" class="btn btn-ba mt-2">
    <i class="bi bi-house"></i> Volver al inicio
  </a>
</div>
</body>
</html>
