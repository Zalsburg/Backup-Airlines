<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backup Airlines</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --ba-blue: #003580; --ba-light: #e8f0fe; }
    body { background-color: var(--ba-light); font-family: 'Segoe UI', sans-serif; }
    .navbar { background-color: var(--ba-blue) !important; }
    .btn-ba { background-color: var(--ba-blue); color: white; }
    .btn-ba:hover { background-color: #002060; color: white; }
    .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .badge-role { font-size: .7rem; }
  </style>
</head>
