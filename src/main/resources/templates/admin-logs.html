<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<nav class="navbar navbar-dark" style="background:#003580;">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">✈ Backup Airlines</a>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-light" th:href="@{/admin/users}"><i class="bi bi-people"></i> Usuarios</a>
      <a class="btn btn-sm btn-outline-light" th:href="@{/admin/files}"><i class="bi bi-folder2-open"></i> Archivos</a>
      <a class="btn btn-sm btn-outline-light" th:href="@{/dashboard}"><i class="bi bi-house"></i> Dashboard</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="card">
    <div class="card-header fw-semibold" style="background:#003580; color:white;">
      <i class="bi bi-journal-text"></i> Registro de actividad (últimas 50 acciones)
      <a class="btn btn-sm btn-light float-end" th:href="@{/admin/logs/export.csv}">
        <i class="bi bi-download"></i> Exportar bitácora (CSV)
      </a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover table-sm align-middle mb-0">
        <thead class="table-light">
          <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Archivo</th></tr>
        </thead>
        <tbody>
          <tr th:each="log : ${logs}">
            <td class="small text-muted" th:text="${log.createdAtFormatted}"></td>
            <td>
              <span th:if="${log.user != null}" th:text="${log.user.username}"></span>
              <span th:unless="${log.user != null}" class="text-muted">—</span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${log.action == 'UPLOAD_FILE'} ? 'bg-success' :
                                    (${log.action == 'DELETE_FILE'} ? 'bg-danger' :
                                    (${log.action == 'SHARE_FILE'} ? 'bg-info' : 'bg-secondary'))"
                    th:text="${log.action}"></span>
            </td>
            <td class="small">
              <span th:if="${log.file != null}" th:text="${log.file.filename}"></span>
              <span th:unless="${log.file != null}" class="text-muted">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
